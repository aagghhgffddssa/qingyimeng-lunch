<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>青藝盟午餐冒險 V3</title><style>
:root{--bg:#fff8ee;--ink:#2f2a25;--muted:#7b7066;--accent:#ff7b54;--yellow:#ffc857;--blue:#5b8def;--green:#78c091;--line:#eadfd3}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:linear-gradient(135deg,#fff8ee,#fff3c9);color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}.wrap{max-width:1150px;margin:auto;padding:24px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 14px 36px #00000010}header{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:18px}h1{font-size:clamp(32px,5vw,52px);margin:0}.muted,.meta,.note{color:var(--muted)}.stats,.filters,.tabs,.badges,.actions{display:flex;gap:8px;flex-wrap:wrap}.stat,.chip,.tab,.pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 11px;font-weight:800}.chip.active{background:var(--ink);color:#fff}.tab.active{background:var(--yellow)}.grid{display:grid;grid-template-columns:1.05fr .95fr;gap:18px}.sync{display:flex;gap:12px;justify-content:space-between;align-items:center}.syncbtn,.add{border:0;border-radius:12px;padding:11px 14px;color:#fff;font-weight:900}.syncbtn{background:var(--blue)}.add{background:var(--green)}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}select,input{width:100%;padding:11px;border:1px solid var(--line);border-radius:12px;background:#fff}.draw{width:100%;margin-top:14px;padding:15px;border:0;border-radius:16px;background:var(--accent);color:#fff;font-size:20px;font-weight:950}.roulette{margin-top:14px;min-height:165px;background:#2f2a25;color:#fff;border-radius:20px;display:flex;align-items:center;justify-content:center;text-align:center;padding:18px}.restaurant-name{font-size:28px;font-weight:950;margin:8px 0}.badge{background:#ffffff20;padding:5px 8px;border-radius:999px;font-size:12px}.mini{background:#ffffff14;border:1px solid #ffffff35;color:#fff;padding:8px 10px;border-radius:10px;font-weight:800}.list{display:grid;gap:9px;max-height:610px;overflow:auto}.shop{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px;border:1px solid var(--line);border-radius:14px}.shop h3{margin:0 0 5px}.meta{font-size:13px;display:flex;gap:6px;flex-wrap:wrap}.iconbtn{background:#fff;border:1px solid var(--line);border-radius:9px;padding:7px}.iconbtn.on{background:#fff1c9}.footer{margin-top:18px}.custom{display:grid;grid-template-columns:1.3fr 1fr 1fr auto;gap:8px}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#2f2a25;color:#fff;padding:10px 15px;border-radius:999px;opacity:0;transition:.2s}.toast.show{opacity:1}@media(max-width:820px){.grid{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}.wrap{padding:14px}.custom{grid-template-columns:1fr 1fr}.custom .add{grid-column:span 2}.sync{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="wrap">
<header><div><div style="font-weight:900;color:var(--accent);letter-spacing:2px">TEENAGER PERFORMING ARTS LEAGUE · LUNCH QUEST V3</div><h1>🍱 青藝盟午餐冒險</h1><div class="muted">基地：新北市淡水區長興街 56 號 1 樓</div></div><div class="stats"><span class="stat">⭐ Lv.<b id="level">1</b></span><span class="stat">⚡ XP <b id="xp">0</b></span></div></header>
<section class="card" style="margin-bottom:18px"><div class="sync"><div><h2 style="margin:0">🌐 Google 午餐雷達</h2><div id="syncStatus" class="muted">這版會優先找真正適合午餐的店。</div><div style="margin-top:8px"><span class="pill">🍱 便當</span><span class="pill">🍜 麵食</span><span class="pill">🥟 小吃</span><span class="pill">🍛 正餐</span></div></div><button id="syncBtn" class="syncbtn">🔄 更新午餐資料庫</button></div><div class="note" style="font-size:12px;margin-top:9px">同步邏輯已改為：附近正餐＋英專路／清水街／博愛街午餐關鍵字補抓，並排除咖啡、糕餅、甜點、伴手禮、飲料店。建議約每週更新一次。</div></section>
<div class="grid"><section class="card"><h2>今天，中午吃什麼？</h2><div id="categoryFilters" class="filters"></div><div class="controls"><select id="budget"><option value="all">💰 預算不限</option><option value="cheap">💰 平價</option><option value="mid">💰 中等</option><option value="treat">💰 犒賞局</option></select><select id="distance"><option value="10">🚶 約 10 分鐘內</option><option value="6">🚶 約 6 分鐘內</option><option value="3">🚶 約 3 分鐘內</option></select></div><button id="drawBtn" class="draw">🎲 命運午餐！</button><div id="roulette" class="roulette"><div><div style="font-size:36px">🥢</div><div class="restaurant-name">等待你的午餐命運</div></div></div></section>
<section class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h2>🗺️ 午餐圖鑑</h2><span class="muted"><b id="count">0</b> 間</span></div><div class="tabs"><button class="tab active" data-tab="all">全部</button><button class="tab" data-tab="google">🌐 Google</button><button class="tab" data-tab="fav">❤️ 收藏</button><button class="tab" data-tab="history">✅ 吃過</button><button class="tab" data-tab="blocked">🫥 封印</button></div><div id="shopList" class="list"></div></section></div>
<section class="card footer"><h2>➕ 私藏店家</h2><div class="custom"><input id="newName" placeholder="店名"><input id="newCat" placeholder="分類"><input id="newAddress" placeholder="地址"><button id="addShop" class="add">加入</button></div></section></div><div id="toast" class="toast"></div>
<script>
const GOOGLE_MAPS_API_KEY="AIzaSyAi4Lup9-WGFhtEm5rsSmUuHHexX0LAB-k",RADIUS=850,$=s=>document.querySelector(s);let googleShops=JSON.parse(localStorage.getItem('lunch_google_shops')||'[]'),custom=JSON.parse(localStorage.getItem('lunch_custom')||'[]'),state=JSON.parse(localStorage.getItem('lunch_state')||'{"xp":0,"fav":[],"blocked":[],"history":[]}'),selectedCat='全部',currentTab='all',currentResult=null;
const seed=[{id:'s1',name:'瑞麟美而美',cat:'早餐／輕食',price:'cheap',mins:1,address:'新北市淡水區長興街52號',rating:4.6,source:'manual'},{id:'s2',name:'淡水喜相逢米粉湯',cat:'台式小吃',price:'cheap',mins:5,address:'新北市淡水區長興街2號',rating:3.7,source:'manual'},{id:'s3',name:'萍萍便當快餐',cat:'便當／自助餐',price:'cheap',mins:7,address:'新北市淡水區博愛街29號',rating:4.3,source:'manual'},{id:'s4',name:'一麵',cat:'麵食',price:'cheap',mins:7,address:'新北市淡水區清水街28號1樓',rating:4.5,source:'manual'}];
const shops=()=>{let m=new Map();[...googleShops,...seed,...custom].forEach(s=>m.set(s.googlePlaceId||s.id,s));return[...m.values()]};function save(){localStorage.setItem('lunch_google_shops',JSON.stringify(googleShops));localStorage.setItem('lunch_custom',JSON.stringify(custom));localStorage.setItem('lunch_state',JSON.stringify(state))}function esc(v){return String(v||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function toast(x){let t=$('#toast');t.textContent=x;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}function priceLabel(p){return p==='mid'?'中等':p==='treat'?'犒賞局':'平價'}
function cats(){return['全部',...new Set(shops().map(s=>s.cat).filter(Boolean))].slice(0,20)}function renderCats(){if(!cats().includes(selectedCat))selectedCat='全部';$('#categoryFilters').innerHTML=cats().map(c=>`<button class="chip ${c===selectedCat?'active':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{selectedCat=b.dataset.cat;renderCats();renderList()})}function filtered(){let b=$('#budget').value,d=+$('#distance').value;return shops().filter(s=>(selectedCat==='全部'||s.cat===selectedCat)&&(b==='all'||s.price===b)&&(s.mins||10)<=d&&!state.blocked.includes(s.id))}function mapsUrl(s){return s.googleMapsURI||'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s.name+' '+(s.address||''))}
function renderList(){let a=shops();if(currentTab==='google')a=a.filter(s=>s.source==='google');if(currentTab==='fav')a=a.filter(s=>state.fav.includes(s.id));if(currentTab==='blocked')a=a.filter(s=>state.blocked.includes(s.id));if(currentTab==='history'){let ids=[...new Set(state.history.map(h=>h.id))];a=ids.map(id=>shops().find(s=>s.id===id)).filter(Boolean)}$('#count').textContent=a.length;$('#shopList').innerHTML=a.length?a.map(s=>`<div class="shop"><div><h3>${esc(s.name)}</h3><div class="meta"><span>🍽️ ${esc(s.cat||'其他')}</span><span>💰 ${priceLabel(s.price)}</span><span>🚶 約 ${s.mins||'?'} 分</span>${s.rating?`<span>⭐ ${s.rating}</span>`:''}</div><div class="meta">${esc(s.address||'')}</div></div><div><button class="iconbtn ${state.fav.includes(s.id)?'on':''}" onclick="fav('${s.id}')">❤️</button><button class="iconbtn" onclick='window.open(${JSON.stringify(mapsUrl(s))},"_blank")'>📍</button><button class="iconbtn ${state.blocked.includes(s.id)?'on':''}" onclick="block('${s.id}')">🫥</button></div></div>`).join(''):'<div class="muted">目前沒有店家</div>'}function fav(id){state.fav=state.fav.includes(id)?state.fav.filter(x=>x!==id):[...state.fav,id];save();renderList()}function block(id){state.blocked=state.blocked.includes(id)?state.blocked.filter(x=>x!==id):[...state.blocked,id];save();renderList()}window.fav=fav;window.block=block;
function show(s,spin=false){$('#roulette').innerHTML=`<div><div style="font-size:30px">${spin?'🎰':'🍴'}</div><div class="restaurant-name">${esc(s.name)}</div><div class="badges"><span class="badge">${esc(s.cat)}</span><span class="badge">${priceLabel(s.price)}</span><span class="badge">🚶 約 ${s.mins} 分</span>${s.rating?`<span class="badge">⭐ ${s.rating}</span>`:''}</div>${spin?'':`<div class="actions"><button class="mini" onclick="eat()">✅ 就吃這間</button><button class="mini" onclick="draw()">🔄 重抽</button><button class="mini" onclick='window.open(${JSON.stringify(mapsUrl(s))},"_blank")'>📍 地圖</button></div>`}</div>`}function draw(){let p=filtered();if(!p.length)return toast('這組條件沒有店家');let i=0,t=setInterval(()=>{show(p[Math.floor(Math.random()*p.length)],true);if(++i>12){clearInterval(t);currentResult=p[Math.floor(Math.random()*p.length)];show(currentResult)}},85)}function eat(){if(!currentResult)return;state.history.push({id:currentResult.id,date:new Date().toISOString().slice(0,10)});state.xp+=20;save();stats();renderList();toast('完成午餐任務！ +20 XP ✨')}window.draw=draw;window.eat=eat;function stats(){$('#xp').textContent=state.xp||0;$('#level').textContent=Math.floor((state.xp||0)/100)+1}
let mapsPromise=null;function loadMaps(){if(window.google?.maps?.importLibrary)return Promise.resolve();if(mapsPromise)return mapsPromise;mapsPromise=new Promise((ok,no)=>{let s=document.createElement('script');s.src='https://maps.googleapis.com/maps/api/js?key='+encodeURIComponent(GOOGLE_MAPS_API_KEY)+'&v=weekly&libraries=places';s.async=true;s.onload=ok;s.onerror=()=>no(new Error('Google Maps 載入失敗'));document.head.appendChild(s)});return mapsPromise}async function locate(){let{Place}=await google.maps.importLibrary('places'),{places}=await Place.searchByText({textQuery:'青少年表演藝術聯盟 新北市淡水區長興街56號',fields:['location'],language:'zh-TW',region:'TW',maxResultCount:1});if(!places?.[0]?.location)throw new Error('找不到青藝盟據點');let p=places[0].location;return{lat:typeof p.lat==='function'?p.lat():p.lat,lng:typeof p.lng==='function'?p.lng():p.lng}}function hav(a,b){let R=6371000,r=x=>x*Math.PI/180,d1=r(b.lat-a.lat),d2=r(b.lng-a.lng),q=Math.sin(d1/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(d2/2)**2;return 2*R*Math.asin(Math.sqrt(q))}function walk(m){return Math.max(1,Math.round(m*1.2/80))}function pLevel(p){let x=String(p||'').toUpperCase();return x.includes('MODERATE')?'mid':x.includes('EXPENSIVE')?'treat':'cheap'}
function isLunch(p,name){let primary=String(p.primaryType||'').toLowerCase(),types=(p.types||[]).map(x=>String(x).toLowerCase()),n=String(name||'').toLowerCase(),badTypes=['cafe','coffee_shop','bakery','dessert_shop','dessert_restaurant','ice_cream_shop','candy_store','confectionery','tea_store','bar','night_club'],badNames=['咖啡','coffee','甜點','甜品','蛋糕','餅舖','餅店','餅家','花生糖','牛軋糖','鳳梨酥','伴手禮','烘焙','麵包','茶飲','手搖','飲料店','冰品','冰店','豆花'];if(badTypes.includes(primary))return false;if(types.some(t=>badTypes.includes(t))&&!types.includes('restaurant'))return false;return !badNames.some(w=>n.includes(w))}
function category(p,name){let t=((p.primaryType||'')+' '+(p.types||[]).join(' ')+' '+name).toLowerCase(),has=a=>a.some(w=>t.includes(w));if(has(['便當','自助餐','快餐','燒臘','排骨飯','雞腿飯']))return'便當／自助餐';if(has(['牛肉麵','麵店','麵館','乾麵','湯麵','麵疙瘩','拉麵','ramen','烏龍麵']))return'麵食';if(has(['水餃','鍋貼','餃子','dumpling']))return'水餃／鍋貼';if(has(['滷肉飯','魯肉飯','雞肉飯','肉燥飯','飯館']))return'飯類';if(has(['咖哩','curry']))return'咖哩';if(has(['japanese','sushi','日式','日本料理','壽司','丼']))return'日式';if(has(['korean','韓式']))return'韓式';if(has(['thai','vietnamese','indonesian','泰式','越南','印尼']))return'東南亞';if(has(['hot_pot','火鍋','鍋物']))return'火鍋';if(has(['hamburger','fast_food','pizza','漢堡','披薩']))return'速食／西式';if(has(['早餐','早午餐','breakfast','brunch','蛋餅','吐司']))return'早餐／輕食';if(has(['小吃','米粉','滷味','鹽酥雞','蚵仔','臭豆腐','肉圓','肉羹','魷魚羹']))return'台式小吃';if(has(['chinese','taiwanese','中式','台菜','臺菜']))return'中式／台式';return'餐廳'}
const fields=['id','displayName','location','formattedAddress','googleMapsURI','rating','userRatingCount','priceLevel','primaryType','types','businessStatus'];async function nearby(c){let{Place,SearchNearbyRankPreference}=await google.maps.importLibrary('places'),{places}=await Place.searchNearby({fields,locationRestriction:{center:c,radius:RADIUS},includedPrimaryTypes:['restaurant'],maxResultCount:20,rankPreference:SearchNearbyRankPreference.DISTANCE,language:'zh-TW',region:'TW'});return places||[]}async function textSearch(q){let{Place}=await google.maps.importLibrary('places'),{places}=await Place.searchByText({textQuery:q,fields,language:'zh-TW',region:'TW',maxResultCount:20});return places||[]}
async function sync(){let b=$('#syncBtn'),s=$('#syncStatus');b.disabled=true;s.textContent='正在定位青藝盟…';try{await loadMaps();let c=await locate(),all=[];try{all.push(...await nearby(c))}catch(e){console.warn(e)}let qs=['淡水 英專路 美食 餐廳','淡水 英專路 便當','淡水 英專路 麵店','淡水 英專路 小吃','淡水 清水街 博愛街 美食','淡水 便當 自助餐','淡水 牛肉麵 水餃','淡水 滷肉飯 飯類','淡水 咖哩 日式 韓式料理'];for(let i=0;i<qs.length;i++){s.textContent=`正在補抓午餐店家 ${i+2} / ${qs.length+1}…`;try{all.push(...await textSearch(qs[i]))}catch(e){console.warn(qs[i],e)}}let m=new Map(),excluded=0;for(let p of all){if(!p.id||!p.location)continue;let lat=typeof p.location.lat==='function'?p.location.lat():p.location.lat,lng=typeof p.location.lng==='function'?p.location.lng():p.location.lng,meters=hav(c,{lat,lng});if(meters>RADIUS)continue;let name=typeof p.displayName==='string'?p.displayName:(p.displayName?.text||'未命名');if(!isLunch(p,name)){excluded++;continue}m.set(p.id,{id:'g-'+p.id,googlePlaceId:p.id,name,cat:category(p,name),price:pLevel(p.priceLevel),mins:walk(meters),address:p.formattedAddress||'',rating:p.rating||null,userRatingCount:p.userRatingCount||null,googleMapsURI:p.googleMapsURI||'',source:'google'})}googleShops=[...m.values()].sort((a,b)=>a.mins-b.mins||(b.rating||0)-(a.rating||0));save();localStorage.setItem('lunch_google_synced_at',new Date().toISOString());s.textContent=`同步完成：${googleShops.length} 間午餐店家｜排除 ${excluded} 間非午餐店`;renderCats();renderList();toast(`找到 ${googleShops.length} 間午餐店家 🍱`)}catch(e){s.textContent='同步失敗：'+(e?.message||e);toast('同步失敗')}finally{b.disabled=false}}
$('#syncBtn').onclick=sync;$('#drawBtn').onclick=draw;$('#budget').onchange=renderList;$('#distance').onchange=renderList;document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{currentTab=b.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));renderList()});$('#addShop').onclick=()=>{let name=$('#newName').value.trim(),cat=$('#newCat').value.trim()||'其他',address=$('#newAddress').value.trim();if(!name)return toast('請填店名');custom.push({id:'custom-'+Date.now(),name,cat,address,price:'cheap',mins:10,source:'manual'});save();renderCats();renderList();toast('已加入私藏店家')};let last=localStorage.getItem('lunch_google_synced_at');if(last)$('#syncStatus').textContent=`已有 ${googleShops.length} 間快取｜上次更新：${new Date(last).toLocaleString('zh-TW')}`;renderCats();renderList();stats();
</script></body></html>
