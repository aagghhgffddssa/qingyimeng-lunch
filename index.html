<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>青藝盟午餐冒險</title>
<style>
:root{--bg:#fff8ee;--ink:#2f2a25;--muted:#7b7066;--accent:#ff7b54;--accent2:#ffc857;--green:#78c091;--blue:#5b8def;--line:#eadfd3}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:linear-gradient(135deg,#fff8ee,#fff2c9);color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}.wrap{max-width:1120px;margin:auto;padding:24px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 14px 36px #00000010}.grid{display:grid;grid-template-columns:1.05fr .95fr;gap:18px}header{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:18px}h1{font-size:clamp(32px,5vw,52px);margin:0}.muted,.meta,.note{color:var(--muted)}.stats,.filters,.tabs,.badges,.actions{display:flex;gap:8px;flex-wrap:wrap}.stat,.chip,.tab{background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 11px;font-weight:800}.chip.active{background:var(--ink);color:#fff}.tab.active{background:var(--accent2)}.sync{display:flex;gap:12px;justify-content:space-between;align-items:center}.syncbtn,.add{border:0;border-radius:12px;padding:11px 14px;color:#fff;font-weight:900}.syncbtn{background:var(--blue)}.add{background:var(--green)}.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}select,input{width:100%;padding:11px;border:1px solid var(--line);border-radius:12px;background:#fff}.draw{width:100%;margin-top:14px;padding:15px;border:0;border-radius:16px;background:var(--accent);color:#fff;font-size:20px;font-weight:950}.roulette{margin-top:14px;min-height:165px;background:#2f2a25;color:#fff;border-radius:20px;display:flex;align-items:center;justify-content:center;text-align:center;padding:18px}.restaurant-name{font-size:28px;font-weight:950;margin:8px 0}.badge{background:#ffffff20;padding:5px 8px;border-radius:999px;font-size:12px}.mini{background:#ffffff14;border:1px solid #ffffff35;color:#fff;padding:8px 10px;border-radius:10px;font-weight:800}.list{display:grid;gap:9px;max-height:610px;overflow:auto}.shop{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px;border:1px solid var(--line);border-radius:14px}.shop h3{margin:0 0 5px}.meta{font-size:13px;display:flex;gap:6px;flex-wrap:wrap}.iconbtn{background:#fff;border:1px solid var(--line);border-radius:9px;padding:7px}.iconbtn.on{background:#fff1c9}.footer{margin-top:18px}.custom{display:grid;grid-template-columns:1.3fr 1fr 1fr auto;gap:8px}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#2f2a25;color:#fff;padding:10px 15px;border-radius:999px;opacity:0;transition:.2s}.toast.show{opacity:1}@media(max-width:820px){.grid{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}.wrap{padding:14px}.custom{grid-template-columns:1fr 1fr}.custom .add{grid-column:span 2}}
</style>
</head>
<body><div class="wrap">
<header><div><div style="font-weight:900;color:var(--accent);letter-spacing:2px">TEENAGER PERFORMING ARTS LEAGUE · LUNCH QUEST</div><h1>🍱 青藝盟午餐冒險</h1><div class="muted">基地：新北市淡水區長興街 56 號 1 樓</div></div><div class="stats"><span class="stat">⭐ Lv.<b id="level">1</b></span><span class="stat">⚡ XP <b id="xp">0</b></span></div></header>
<section class="card" style="margin-bottom:18px"><div class="sync"><div><h2 style="margin:0">🌐 Google 午餐雷達</h2><div id="syncStatus" class="muted">第一次使用請按同步。</div></div><button id="syncBtn" class="syncbtn">🔄 同步 Google 店家</button></div><div class="note" style="font-size:12px;margin-top:8px">同步青藝盟周邊約 850 公尺餐飲店，結果會存在每位使用者自己的瀏覽器。</div></section>
<div class="grid"><section class="card"><h2>今天，中午吃什麼？</h2><div id="categoryFilters" class="filters"></div><div class="controls"><select id="budget"><option value="all">💰 預算不限</option><option value="cheap">💰 平價</option><option value="mid">💰 中等</option><option value="treat">💰 犒賞局</option></select><select id="distance"><option value="10">🚶 約 10 分鐘內</option><option value="6">🚶 約 6 分鐘內</option><option value="3">🚶 約 3 分鐘內</option></select></div><button id="drawBtn" class="draw">🎲 命運午餐！</button><div id="roulette" class="roulette"><div><div style="font-size:36px">🥢</div><div class="restaurant-name">等待你的午餐命運</div></div></div></section>
<section class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h2>🗺️ 午餐圖鑑</h2><span class="muted"><b id="count">0</b> 間</span></div><div class="tabs"><button class="tab active" data-tab="all">全部</button><button class="tab" data-tab="google">🌐 Google</button><button class="tab" data-tab="fav">❤️ 收藏</button><button class="tab" data-tab="history">✅ 吃過</button><button class="tab" data-tab="blocked">🫥 封印</button></div><div id="shopList" class="list"></div></section></div>
<section class="card footer"><h2>➕ 私藏店家</h2><div class="custom"><input id="newName" placeholder="店名"><input id="newCat" placeholder="分類"><input id="newAddress" placeholder="地址"><button id="addShop" class="add">加入</button></div></section>
</div><div id="toast" class="toast"></div>
<script>
const GOOGLE_MAPS_API_KEY="PASTE_YOUR_GOOGLE_MAPS_API_KEY_HERE";
const RADIUS=850,$=s=>document.querySelector(s);let googleShops=JSON.parse(localStorage.getItem('lunch_google_shops')||'[]'),custom=JSON.parse(localStorage.getItem('lunch_custom')||'[]'),state=JSON.parse(localStorage.getItem('lunch_state')||'{"xp":0,"fav":[],"blocked":[],"history":[]}'),selectedCat='全部',currentTab='all',currentResult=null;
const seed=[{id:'s1',name:'瑞麟美而美',cat:'早餐／輕食',price:'cheap',mins:1,address:'新北市淡水區長興街52號',rating:4.6,source:'manual'},{id:'s2',name:'淡水喜相逢米粉湯',cat:'台式小吃',price:'cheap',mins:5,address:'新北市淡水區長興街2號',rating:3.7,source:'manual'},{id:'s3',name:'萍萍便當快餐',cat:'便當',price:'cheap',mins:7,address:'新北市淡水區博愛街29號',rating:4.3,source:'manual'},{id:'s4',name:'一麵',cat:'麵食',price:'cheap',mins:7,address:'新北市淡水區清水街28號1樓',rating:4.5,source:'manual'}];
const shops=()=>{let m=new Map();[...googleShops,...seed,...custom].forEach(s=>m.set(s.googlePlaceId||s.id,s));return[...m.values()]};function save(){localStorage.setItem('lunch_google_shops',JSON.stringify(googleShops));localStorage.setItem('lunch_custom',JSON.stringify(custom));localStorage.setItem('lunch_state',JSON.stringify(state))}function esc(v){return String(v||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function priceLabel(p){return p==='mid'?'中等':p==='treat'?'犒賞局':'平價'}function toast(x){let t=$('#toast');t.textContent=x;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function cats(){return['全部',...new Set(shops().map(s=>s.cat).filter(Boolean))].slice(0,20)}function renderCats(){if(!cats().includes(selectedCat))selectedCat='全部';$('#categoryFilters').innerHTML=cats().map(c=>`<button class="chip ${c===selectedCat?'active':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{selectedCat=b.dataset.cat;renderCats();renderList()})}function filtered(){let b=$('#budget').value,d=+$('#distance').value;return shops().filter(s=>(selectedCat==='全部'||s.cat===selectedCat)&&(b==='all'||s.price===b)&&(s.mins||10)<=d&&!state.blocked.includes(s.id))}function mapsUrl(s){return s.googleMapsURI||'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s.name+' '+(s.address||''))}
function renderList(){let a=shops();if(currentTab==='google')a=a.filter(s=>s.source==='google');if(currentTab==='fav')a=a.filter(s=>state.fav.includes(s.id));if(currentTab==='blocked')a=a.filter(s=>state.blocked.includes(s.id));if(currentTab==='history'){let ids=[...new Set(state.history.map(h=>h.id))];a=ids.map(id=>shops().find(s=>s.id===id)).filter(Boolean)}$('#count').textContent=a.length;$('#shopList').innerHTML=a.length?a.map(s=>`<div class="shop"><div><h3>${esc(s.name)}</h3><div class="meta"><span>🍽️ ${esc(s.cat||'其他')}</span><span>💰 ${priceLabel(s.price)}</span><span>🚶 約 ${s.mins||'?'} 分</span>${s.rating?`<span>⭐ ${s.rating}</span>`:''}</div><div class="meta">${esc(s.address||'')}</div></div><div><button class="iconbtn ${state.fav.includes(s.id)?'on':''}" onclick="fav('${s.id}')">❤️</button><button class="iconbtn" onclick='window.open(${JSON.stringify(mapsUrl(s))},"_blank")'>📍</button><button class="iconbtn ${state.blocked.includes(s.id)?'on':''}" onclick="block('${s.id}')">🫥</button></div></div>`).join(''):'<div class="muted">目前沒有店家</div>'}function fav(id){state.fav=state.fav.includes(id)?state.fav.filter(x=>x!==id):[...state.fav,id];save();renderList()}function block(id){state.blocked=state.blocked.includes(id)?state.blocked.filter(x=>x!==id):[...state.blocked,id];save();renderList()}window.fav=fav;window.block=block;
function show(s,spin=false){$('#roulette').innerHTML=`<div><div style="font-size:30px">${spin?'🎰':'🍴'}</div><div class="restaurant-name">${esc(s.name)}</div><div class="badges"><span class="badge">${esc(s.cat)}</span><span class="badge">${priceLabel(s.price)}</span><span class="badge">🚶 約 ${s.mins} 分</span>${s.rating?`<span class="badge">⭐ ${s.rating}</span>`:''}</div>${spin?'':`<div class="actions"><button class="mini" onclick="eat()">✅ 就吃這間</button><button class="mini" onclick="draw()">🔄 重抽</button><button class="mini" onclick='window.open(${JSON.stringify(mapsUrl(s))},"_blank")'>📍 地圖</button></div>`}</div>`}function draw(){let p=filtered();if(!p.length)return toast('這組條件沒有店家');let i=0,t=setInterval(()=>{show(p[Math.floor(Math.random()*p.length)],true);if(++i>12){clearInterval(t);currentResult=p[Math.floor(Math.random()*p.length)];show(currentResult)}},85)}function eat(){if(!currentResult)return;state.history.push({id:currentResult.id,date:new Date().toISOString().slice(0,10)});state.xp+=20;save();stats();renderList();toast('完成午餐任務！ +20 XP ✨')}window.draw=draw;window.eat=eat;function stats(){$('#xp').textContent=state.xp||0;$('#level').textContent=Math.floor((state.xp||0)/100)+1}
let mapsPromise=null;function loadMaps(){if(GOOGLE_MAPS_API_KEY.includes('PASTE_'))throw new Error('尚未設定 Google Maps API Key');if(window.google?.maps?.importLibrary)return Promise.resolve();if(mapsPromise)return mapsPromise;mapsPromise=new Promise((ok,no)=>{let s=document.createElement('script');s.src='https://maps.googleapis.com/maps/api/js?key='+encodeURIComponent(GOOGLE_MAPS_API_KEY)+'&v=weekly&libraries=places';s.async=true;s.onload=ok;s.onerror=()=>no(new Error('Google Maps 載入失敗'));document.head.appendChild(s)});return mapsPromise}async function locate(){let{Place}=await google.maps.importLibrary('places'),{places}=await Place.searchByText({textQuery:'青少年表演藝術聯盟 新北市淡水區長興街56號',fields:['location'],language:'zh-TW',region:'TW',maxResultCount:1});if(!places?.[0]?.location)throw new Error('找不到青藝盟據點');let p=places[0].location;return{lat:typeof p.lat==='function'?p.lat():p.lat,lng:typeof p.lng==='function'?p.lng():p.lng}}function hav(a,b){let R=6371000,r=x=>x*Math.PI/180,d1=r(b.lat-a.lat),d2=r(b.lng-a.lng),q=Math.sin(d1/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(d2/2)**2;return 2*R*Math.asin(Math.sqrt(q))}function walk(m){return Math.max(1,Math.round(m*1.2/80))}function pLevel(p){let x=String(p||'');return x.includes('MODERATE')?'mid':x.includes('EXPENSIVE')?'treat':'cheap'}function category(p){let t=((p.primaryType||'')+' '+(p.types||[]).join(' ')).toLowerCase();if(t.includes('bakery'))return'烘焙／甜點';if(t.includes('cafe'))return'咖啡／輕食';if(t.includes('japanese')||t.includes('sushi')||t.includes('ramen'))return'日式';if(t.includes('korean'))return'韓式';if(t.includes('thai')||t.includes('vietnamese'))return'東南亞';if(t.includes('fast_food')||t.includes('hamburger'))return'速食';if(t.includes('chinese')||t.includes('taiwanese'))return'中式／台式';return'餐廳'}async function searchType(c,type){let{Place,SearchNearbyRankPreference}=await google.maps.importLibrary('places'),{places}=await Place.searchNearby({fields:['id','displayName','location','formattedAddress','googleMapsURI','rating','userRatingCount','priceLevel','primaryType','types'],locationRestriction:{center:c,radius:RADIUS},includedPrimaryTypes:[type],maxResultCount:20,rankPreference:SearchNearbyRankPreference.POPULARITY,language:'zh-TW',region:'TW'});return places||[]}
async function sync(){let b=$('#syncBtn'),s=$('#syncStatus');b.disabled=true;s.textContent='同步中…';try{await loadMaps();let c=await locate(),all=[];for(let t of['restaurant','cafe','bakery']){try{all.push(...await searchType(c,t))}catch(e){console.warn(e)}}let m=new Map();all.forEach(p=>{if(!p.id||!p.location)return;let lat=typeof p.location.lat==='function'?p.location.lat():p.location.lat,lng=typeof p.location.lng==='function'?p.location.lng():p.location.lng,name=typeof p.displayName==='string'?p.displayName:(p.displayName?.text||'未命名');m.set(p.id,{id:'g-'+p.id,googlePlaceId:p.id,name,cat:category(p),price:pLevel(p.priceLevel),mins:walk(hav(c,{lat,lng})),address:p.formattedAddress||'',rating:p.rating||null,googleMapsURI:p.googleMapsURI||'',source:'google'})});googleShops=[...m.values()].sort((a,b)=>a.mins-b.mins);save();s.textContent=`同步完成：${googleShops.length} 間 Google 店家`;renderCats();renderList();toast(`同步完成：${googleShops.length} 間 🌐`)}catch(e){s.textContent='同步失敗：'+(e?.message||e);toast('同步失敗')}finally{b.disabled=false}}
$('#syncBtn').onclick=sync;$('#drawBtn').onclick=draw;$('#budget').onchange=renderList;$('#distance').onchange=renderList;document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{currentTab=b.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));renderList()});$('#addShop').onclick=()=>{let name=$('#newName').value.trim(),cat=$('#newCat').value.trim()||'其他',address=$('#newAddress').value.trim();if(!name)return toast('請填店名');custom.push({id:'custom-'+Date.now(),name,cat,address,price:'cheap',mins:10,source:'manual'});save();renderCats();renderList();toast('已加入私藏店家')};renderCats();renderList();stats();
</script></body></html>
